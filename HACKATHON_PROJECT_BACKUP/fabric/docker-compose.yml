name: aicte-securedc-fabric
version: "3.8"

networks:
  default:
    name: fabric_test

services:
  orderer.aicte.gov.in:
    container_name: orderer.aicte.gov.in
    image: hyperledger/fabric-orderer:2.5
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED: "true"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_FILELEDGER_LOCATION: /var/hyperledger/production/orderer
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8443
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/aicte.gov.in/orderers/orderer.aicte.gov.in/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/aicte.gov.in/orderers/orderer.aicte.gov.in/tls:/var/hyperledger/orderer/tls
      - orderer.aicte.gov.in:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "9443:9443"
    networks:
      default:
        aliases:
          - orderer.aicte.gov.in

  peer0.securedc.aicte.gov.in:
    container_name: peer0.securedc.aicte.gov.in
    image: hyperledger/fabric-peer:2.5
    environment:
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: peer0.securedc.aicte.gov.in
      CORE_PEER_ADDRESS: peer0.securedc.aicte.gov.in:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.securedc.aicte.gov.in:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.securedc.aicte.gov.in:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.securedc.aicte.gov.in:7051
      CORE_PEER_GOSSIP_USELEADERELECTION: "false"
      CORE_PEER_GOSSIP_ORGLEADER: "true"
      CORE_PEER_LOCALMSPID: AicteMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_PEER_TLS_CLIENTAUTHREQUIRED: "false"
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: fabric_test
      CORE_CHAINCODE_EXECUTETIMEOUT: 300s
      CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG: '{"peername":"peer0aicte"}'
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
    volumes:
      - ./organizations/peerOrganizations/securedc.aicte.gov.in/peers/peer0.securedc.aicte.gov.in:/etc/hyperledger/peer
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.securedc.aicte.gov.in:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "7051:7051"
    depends_on:
      - orderer.aicte.gov.in
    networks:
      default:
        aliases:
          - peer0.securedc.aicte.gov.in

  cli:
    container_name: fabric-cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: fabric-cli
      CORE_PEER_ADDRESS: peer0.securedc.aicte.gov.in:7051
      CORE_PEER_LOCALMSPID: AicteMSP
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/securedc.aicte.gov.in/peers/peer0.securedc.aicte.gov.in/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/securedc.aicte.gov.in/peers/peer0.securedc.aicte.gov.in/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/securedc.aicte.gov.in/peers/peer0.securedc.aicte.gov.in/tls/ca.crt
      CORE_PEER_MSPCONFIGPATH: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/securedc.aicte.gov.in/users/Admin@securedc.aicte.gov.in/msp
      ORDERER_CA: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/ordererOrganizations/aicte.gov.in/orderers/orderer.aicte.gov.in/tls/ca.crt
      ORDERER_ADMIN_TLS_SIGN_CERT: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/ordererOrganizations/aicte.gov.in/orderers/orderer.aicte.gov.in/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATE_KEY: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/ordererOrganizations/aicte.gov.in/orderers/orderer.aicte.gov.in/tls/server.key
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - ./:/opt/gopath/src/github.com/hyperledger/fabric/peer
      - ./organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./chaincode:/opt/gopath/src/github.com/chaincode
    depends_on:
      - peer0.securedc.aicte.gov.in
      - orderer.aicte.gov.in

  fabric-anchor:
    container_name: fabric-anchor
    build:
      context: ./anchor
      dockerfile: Dockerfile
    environment:
      FABRIC_PEER_ENDPOINT: peer0.securedc.aicte.gov.in:7051
      FABRIC_PEER_HOST_OVERRIDE: peer0.securedc.aicte.gov.in
      FABRIC_MSP_ID: AicteMSP
      FABRIC_CHANNEL: auditchannel
      FABRIC_CHAINCODE: auditcc
      FABRIC_CRYPTO_PATH: /crypto
      FABRIC_ANCHOR_PORT: "8088"
    volumes:
      - ./organizations:/crypto:ro
    ports:
      - "8088:8088"
    depends_on:
      - peer0.securedc.aicte.gov.in
    restart: unless-stopped

volumes:
  orderer.aicte.gov.in:
  peer0.securedc.aicte.gov.in:
