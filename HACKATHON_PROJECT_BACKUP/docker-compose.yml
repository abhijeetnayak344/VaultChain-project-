services:
  db:
    image: postgres:16-alpine
    container_name: securedc-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securedc}
      POSTGRES_USER: ${POSTGRES_USER:-securedc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securedc_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securedc} -d ${POSTGRES_DB:-securedc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securedc-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_ANCHOR_URL: ${FABRIC_ANCHOR_URL:-http://host.docker.internal:8088}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_rbac &&
             python manage.py seed_dashboard &&
             python manage.py seed_audit &&
             python manage.py seed_blockchain &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: securedc-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
